name: Update Star History RSS Feed

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC daily
    - cron: '30 13 * * *'  # 13:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run feed update script
        run: python star_weekly_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json star-history-weekly.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Star History RSS feed"
            git push
          fi
